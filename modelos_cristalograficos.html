<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solucionario Rápido: 150 Modelos Cristalográficos - UNAL Medellín</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-gold: #f59e0b;
            --accent-emerald: #10b981;
            --accent-purple: #c084fc;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-primary); padding: 20px; line-height: 1.5; }

        header {
            max-width: 1200px;
            margin: 0 auto 25px auto;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        .header-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .header-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #c084fc, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-sub { color: var(--text-secondary); font-size: 0.95rem; margin-top: 6px; }

        .btn-nav {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-nav:hover { background: var(--accent-cyan); color: #0f172a; }

        .search-area {
            max-width: 1200px;
            margin: 0 auto 25px auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            background: var(--bg-card);
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--accent-gold); box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }

        .chips-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .chip {
            background: #1e293b;
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            white-space: nowrap;
            transition: all 0.2s;
        }
        .chip.active, .chip:hover { background: var(--accent-cyan); color: #0f172a; border-color: var(--accent-cyan); }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover { transform: translateY(-3px); border-color: var(--accent-cyan); }

        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .model-num {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .model-num::before { content: "🔷"; font-size: 1rem; }

        .sys-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 9999px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .class-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-purple);
            border-bottom: 1px dashed var(--border);
            padding-bottom: 6px;
        }

        .notation-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .notation-box span { color: var(--text-secondary); }
        .notation-val { font-weight: 700; color: #fff; margin-left: 4px; font-family: monospace; font-size: 0.95rem; }

        .forms-box {
            font-size: 0.9rem;
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.4);
            padding: 12px;
            border-radius: 8px;
            white-space: pre-line;
            border-left: 3px solid var(--accent-emerald);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }
    </style>
</head>

alrededor de Z).\nFormas:\na) Pinacoide Lateral\nb) Pinacoide de tercer orden positivo\nc) Pinacoide de tercer orden positivo\nd) Pinacoide Lateral\ne) Pinacoide de segundo orden negativo\nf) Pinacoide de primer orden negativo\ng) Pinacoide de primer orden positivo"}];

        const searchInput = document.getElementById("searchInput");
        const sysChips = document.getElementById("sysChips");
        const gridEl = document.getElementById("modelsGrid");

        let currentSys = "ALL";
        let searchQuery = "";

        function renderModels() {
            gridEl.innerHTML = "";

            let filtered = modelsData.filter(m => {
                const matchSys = currentSys === "ALL" || m.s.includes(currentSys);
                const q = searchQuery.toLowerCase().strip ? searchQuery.toLowerCase().strip() : searchQuery.toLowerCase();
                if (!q) return matchSys;

                const matchNum = m.n.toString() === q || m.n.toString().startsWith(q);
                const matchText = m.s.toLowerCase().includes(q) || 
                                  m.c.toLowerCase().includes(q) || 
                                  m.hm.toLowerCase().includes(q) || 
                                  m.f.toLowerCase().includes(q);

                return matchSys && (matchNum || matchText);
            });

            if (filtered.length === 0) {
                gridEl.innerHTML = `<div class="no-results">No se encontró el modelo introducido. Ingresa un número de 1 a 150.</div>`;
                return;
            }

            filtered.forEach(m => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-top">
                        <div class="model-num">Modelo ${m.n}</div>
                        <div class="sys-badge">${m.s}</div>
                    </div>

                    <div class="class-title">${m.c}</div>

                    <div class="notation-box">
                        <div><span>Hermann-Mauguin:</span> <span class="notation-val">${m.hm.replace(/([0-9])̄/g, '<span style="text-decoration: overline;">$1</span>')}</span></div>
                        <div><span>Simetría Sencilla:</span> <span class="notation-val">${m.sim.replace(/Ā([0-9])/g, 'A<span style="text-decoration: overline;">$1</span>').replace(/A([0-9])̄/g, 'A<span style="text-decoration: overline;">$1</span>')}</span></div>
                    </div>

                    <div class="forms-box">${m.f}</div>
                `;
                gridEl.appendChild(card);
            });
        }

        searchInput.addEventListener("input", (e) => {
            searchQuery = e.target.value;
            renderModels();
        });

        sysChips.addEventListener("click", (e) => {
            if (e.target.classList.contains("chip")) {
                document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
                e.target.classList.add("active");
                currentSys = e.target.getAttribute("data-sys");
                renderModels();
            }
        });

        renderModels();
    </script>
